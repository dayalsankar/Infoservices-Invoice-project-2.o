<!--
  topbar.html
  ─────────────────────────────────────────────────────────────────────────────
  64px top bar above the main content area.
  Contains: page title + breadcrumb, search, currency toggle, notification
  bell with red dot, and primary "+ New Invoice" CTA.

  Structure:
    .topbar
      .topbar__title  (heading + breadcrumb)
      .topbar__actions (search + currency + icon-btn + btn--primary)
-->

<header class="topbar">

  <div class="topbar__title">
    <h1 class="topbar__heading">Finance Dashboard</h1>
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <span>INFO Services</span>
      <span class="breadcrumb__sep" aria-hidden="true">·</span>
      <span>Enterprise Invoicing Platform</span>
    </nav>
  </div>

  <div class="topbar__actions">

    <label class="topbar__search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>
      <input type="search" placeholder="Search invoices, clients…" aria-label="Search" />
    </label>

    <div class="currency-toggle" role="radiogroup" aria-label="Currency">
      <button class="currency-toggle__btn is-active" data-currency="INR" role="radio" aria-checked="true">
        <span class="currency-toggle__symbol">₹</span> INR
      </button>
      <button class="currency-toggle__btn" data-currency="USD" role="radio" aria-checked="false">
        <span class="currency-toggle__symbol">$</span> USD
      </button>
    </div>

    <button class="icon-btn icon-btn--bell" aria-label="Notifications (7 new)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
      </svg>
      <span class="icon-btn__dot"></span>
    </button>

    <button class="btn btn--primary">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      New Invoice
    </button>
  </div>
</header>
